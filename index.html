<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="AgiotoPay - Sistema de Gerenciamento Financeiro de Empréstimos. Controle clientes, parcelas, juros e pagamentos." />
    <title>AgiotoPay - Gerenciamento de Empréstimos</title>
    <script>
      // Single Page Application (SPA) redirect handler for static hosts
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&'); 
          }).filter(function(s) {
            return s.slice(0, 2) === 'p=';
          })[0];
          if (decoded) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decodeURIComponent(decoded.slice(2)) + l.hash
            );
          }
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
